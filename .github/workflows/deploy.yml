name: Release & Deploy

# Chạy khi đẩy tag phiên bản, ví dụ:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write        # cho phép push image lên GitHub Container Registry

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shop-backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shop-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shop-frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/shop-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server (SSH)
    runs-on: ubuntu-latest
    needs: publish
    environment: production      # có thể bật "required reviewers" để duyệt tay trước khi deploy
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/shop
      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OWNER,TAG
          script: |
            cd /opt/shop
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_OWNER="$OWNER" TAG="$TAG"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
    env:
      TAG: ${{ github.ref_name }}
